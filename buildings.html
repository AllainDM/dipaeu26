<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Постройки — Энциклопедия игры</title>
    <style>
        body { max-width: 1366px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }

        /* Фильтры */
        #filters {
            margin: 15px 0;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 6px;
        }
        #category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .cat-btn {
            padding: 5px 12px;
            border: 2px solid #3F4137;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            user-select: none;
            transition: all 0.15s;
        }
        .cat-btn:hover {
            background: #fdf2e2;
            border-color: #FDA83D;
        }
        .cat-btn.active {
            background: #FDA83D;
            color: #3F4137;
            border-color: #FDA83D;
        }

        #search-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        #search-input {
            flex: 1;
            min-width: 200px;
            padding: 6px 10px;
            border: 1px solid #bcbcbc;
            border-radius: 4px;
            font-size: 15px;
        }
        #result-count {
            font-size: 14px;
            color: #555;
            white-space: nowrap;
        }

        /* Обёртка для скролла */
        #table-wrapper {
            overflow: auto;
            position: sticky;
            top: 0;
            max-height: calc(100vh - 170px);
            z-index: 3;
            background: white;
            border: 1px solid #bcbcbc;
            border-radius: 4px;
        }
        #buildings-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
            font-size: 14px;
            background: white;
            font-variant-numeric: tabular-nums;
        }
        #buildings-table th {
            background: #3F4137;
            color: #fdc073;
            padding: 6px 8px;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        #buildings-table th:hover {
            background: #4a4d42;
        }
        #buildings-table th .sort-arrow {
            margin-left: 3px;
            font-size: 11px;
        }
        #buildings-table th:first-child {
            position: sticky;
            left: 0;
            z-index: 4;
            background: #3F4137;
        }
        #buildings-table th:nth-child(2) {
            position: sticky;
            left: 24px;
            z-index: 3;
            background: #3F4137;
        }
        /* Ширины колонок (table-layout: fixed) */
        #buildings-table th:nth-child(1)  { width: 24px; }
        #buildings-table th:nth-child(2)  { width: 100px; }
        #buildings-table th:nth-child(3)  { width: 6%; }
        #buildings-table th:nth-child(4)  { width: 6%; }
        #buildings-table th:nth-child(5)  { width: 7%; }
        #buildings-table th:nth-child(6)  { width: 7%; }
        #buildings-table th:nth-child(7)  { width: 9%; }
        #buildings-table th:nth-child(8)  { width: 9%; }
        #buildings-table th:nth-child(9)  { width: 9%; }
        #buildings-table th:nth-child(10) { width: 8%; }
        #buildings-table th:nth-child(11) { width: 13%; }
        #buildings-table th:nth-child(12) { width: 13%; }
        #buildings-table th:nth-child(13) { width: 3%; }
        #buildings-table td {
            border: 1px solid #bcbcbc;
            padding: 6px 8px;
            vertical-align: top;
            line-height: 1.4;
        }

        /* Зебра по группам */
        #buildings-table tbody tr.group-zebra {
            background: #f4f4f4;
        }
        #buildings-table tbody tr:hover {
            background: #fdf2e2;
        }

        /* Sticky колонки */
        #buildings-table td.cat-emoji-cell,
        #buildings-table td.name-cell {
            position: sticky;
            z-index: 1;
            background: #fff;
        }
        #buildings-table td.cat-emoji-cell {
            left: 0;
            text-align: center;
            font-size: 14px;
            width: 24px;
            min-width: 24px;
        }
        #buildings-table td.name-cell {
            left: 24px;
            font-weight: bold;
            white-space: nowrap;
            min-width: 110px;
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #buildings-table tbody tr.group-zebra td.cat-emoji-cell,
        #buildings-table tbody tr.group-zebra td.name-cell {
            background: #f4f4f4;
        }
        #buildings-table tbody tr:hover td.cat-emoji-cell,
        #buildings-table tbody tr:hover td.name-cell {
            background: #fdf2e2;
        }

        /* Ширины колонок */
        .cell-cost {
            overflow-wrap: break-word;
        }
        .cell-income {
            overflow-wrap: break-word;
        }
        .cell-resource {
            width: 90px;
            max-width: 110px;
        }
        .cell-conditions {
            width: 110px;
            max-width: 130px;
        }
        .cell-bonuses {
            min-width: 160px;
            max-width: 240px;
        }
        .cell-notes {
            width: 80px;
            max-width: 100px;
        }

        /* Clamp для длинных ячеек */
        .cell-clamp {
            cursor: pointer;
        }
        .cell-clamp .clamp-inner {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }
        .cell-clamp.expanded .clamp-inner {
            -webkit-line-clamp: unset;
            display: block;
        }

        /* Пустые значения */
        .val-empty {
            color: #999;
        }

        /* Цвета для Цена */
        .cost-cheap {
            background-color: #e2f3e7;
        }
        .cost-mid {
            background-color: #fff3cd;
        }
        .cost-expensive {
            background-color: #fce8e9;
        }

        /* Цвета для Доход */
        .income-negative {
            background-color: #fce8e9;
        }
        .income-low {
            background-color: #fff3cd;
        }
        .income-mid {
            background-color: #e2f3e7;
        }
        .income-high {
            background-color: #c8e6c9;
        }
        .income-very-high {
            background-color: #a5d6a7;
        }

        @media (max-width: 700px) {
            .cat-btn {
                font-size: 12px;
                padding: 4px 8px;
            }
            #buildings-table {
                font-size: 13px;
            }
            #buildings-table td {
                padding: 4px 6px;
            }
            #buildings-table td.name-cell {
                min-width: 90px;
                max-width: 110px;
                left: 24px;
            }
        }
    </style>
</head>

    <p style="background:#fff3cd;border-left:4px solid #ffc107;padding:10px 16px;margin:12px 0;font-size:14px;">⚠ Экспериментальная страница. Клик по ячейке с многоточием раскрывает полный текст.</p>

    <div id="filters">
        <div id="category-filters"></div>
        <div id="search-bar">

    <script src="buildings.js"></script>
